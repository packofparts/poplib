name: PR Validation

on:
  pull_request:
    branches: [ "main" ]

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write
      security-events: write

    strategy:
      fail-fast: false

    steps:
    - name: Checking out Code
      uses: actions/checkout@v4

    - name: Fetching Git Tags
      run: git fetch --tags

    - name: Setting up Java
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'

    - name: Setting up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        dependency-graph: generate-and-submit

    - name: Initializing CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java

    - name: Building
      run: ./gradlew build --info
      env:
        PACKAGE_FETCH_ACTOR: ${{ github.actor }}
        PACKAGE_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Analyzing
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java"

  sonar:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    # Only run Sonar for PRs from the same repository or when a SONAR_TOKEN secret exists.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || secrets.SONAR_TOKEN != '' }}

    steps:
    - name: Checking out Code
      uses: actions/checkout@v4

    - name: Fetching Git Tags
      run: git fetch --tags

    - name: Setting up Java
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'

    - name: Setting up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Check SONAR_TOKEN presence and validate
      # This step never prints the token itself. It will print "found key" if the token is present and valid.
      run: |
        # If secret is not present, fail early.
        if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
          echo "SONAR_TOKEN not set"
          exit 1
        fi

        # Validate token against SonarCloud authentication endpoint.
        # GitHub redacts secrets in logs; we only inspect the HTTP status code.
        status=$(curl -sS -u "${{ secrets.SONAR_TOKEN }}:" -o /dev/null -w "%{http_code}" "https://sonarcloud.io/api/authentication/validate" || echo "000")

        if [ "$status" = "200" ]; then
          echo "found key"
        else
          echo "ERROR: SONAR_TOKEN appears invalid (HTTP $status)"
          exit 1
        fi

    - name: Caching SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Building and Analyzing
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        PACKAGE_FETCH_ACTOR: ${{ github.actor }}
        PACKAGE_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >
        ./gradlew \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.projectKey=poplib \
          -Dsonar.organization=packofparts \
          -Dsonar.host.url=https://sonarcloud.io \
          build sonar --info --stacktrace -Dsonar.verbose=true
